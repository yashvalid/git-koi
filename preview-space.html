<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Cosmic Git Koi — Deep Space Canvas</title>
  <style>
    body {
      margin: 0;
      background: #06060f;
      color: #eee;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      gap: 16px;
    }
    canvas {
      image-rendering: pixelated;
      width: 512px;
      height: 512px;
      border-radius: 12px;
      box-shadow: 0 0 50px rgba(110, 50, 160, 0.45);
      border: 1px solid rgba(255, 255, 255, 0.1);
    }
    .badge {
      font-size: 14px;
      font-weight: 600;
      color: #c4b5fd;
      background: rgba(255, 255, 255, 0.06);
      padding: 8px 18px;
      border-radius: 20px;
      border: 1px solid rgba(255, 255, 255, 0.12);
      letter-spacing: 0.5px;
    }
    .desc {
      font-size: 12px;
      color: #8b949e;
      text-align: center;
    }
  </style>
</head>
<body>
  <div class="badge">✨ Cosmic Space Koi — Deep Space Background Preview</div>
  <canvas id="c" width="256" height="256"></canvas>
  <div class="desc">Pixel-art nebula band, dithered gradient, twinkling cross-flare stars, and Saturn-like ringed planet</div>

  <script>
    const canvas = document.getElementById('c');
    const ctx = canvas.getContext('2d');
    const width = 256;
    const height = 256;

    const NEBULA_RAMP = [
      [8, 8, 20],
      [16, 14, 40],
      [30, 20, 64],
      [52, 28, 96],
      [86, 40, 124],
      [128, 64, 150]
    ];
    const STAR_DIM = [90, 96, 130];
    const STAR_COLORS = [[255, 255, 255], [255, 226, 170], [180, 210, 255]];
    const STAR_GLOW = [150, 160, 210];
    const PLANET_RAMP = [[232, 140, 100], [184, 92, 80], [118, 52, 66], [58, 26, 46]];
    const RING_COLORS = [[214, 184, 150], [140, 112, 104]];

    const DITHER = [
      [0, 8, 2, 10],
      [12, 4, 14, 6],
      [3, 11, 1, 9],
      [15, 7, 13, 5]
    ];

    function ditherThreshold(x, y) {
      return (DITHER[y % 4][x % 4] + 0.5) / 16.0;
    }

    function hashPixel(x, y, salt) {
      let h = Math.imul(x, 0x8da6b343) ^ Math.imul(y, 0xd8163841) ^ Math.imul(salt, 0xcb1ab31f);
      h ^= (h >>> 13);
      h = Math.imul(h, 0x5bd1e995);
      return (h ^ (h >>> 15)) >>> 0;
    }

    function valueNoise(x, y, cellPixels, salt) {
      const cellX = Math.floor(x / cellPixels);
      const cellY = Math.floor(y / cellPixels);
      const fx = x / cellPixels - cellX;
      const fy = y / cellPixels - cellY;
      const sx = fx * fx * (3 - 2 * fx);
      const sy = fy * fy * (3 - 2 * fy);
      const corner = (dx, dy) => hashPixel(cellX + dx, cellY + dy, salt) / 4294967295;
      const top = corner(0, 0) + (corner(1, 0) - corner(0, 0)) * sx;
      const bottom = corner(0, 1) + (corner(1, 1) - corner(0, 1)) * sx;
      return top + (bottom - top) * sy;
    }

    function nebulaColor(x, y) {
      const bandOffset = (x - 0.8 * y - 40.0) / 70.0;
      const band = Math.exp(-bandOffset * bandOffset);
      const cloud = 0.55 * valueNoise(x, y, 48.0, 1)
                  + 0.30 * valueNoise(x, y, 20.0, 2)
                  + 0.15 * valueNoise(x, y, 8.0, 3);
      const intensity = Math.max(0, Math.min(1, band * (0.35 + cloud) - 0.12));
      const pos = intensity * 5;
      const idx = Math.floor(pos);
      const stepUp = (pos - idx) > ditherThreshold(x, y);
      const rampIdx = Math.min(5, idx + (stepUp ? 1 : 0));
      return NEBULA_RAMP[rampIdx];
    }

    function isStar(x, y) {
      return (hashPixel(x, y, 0) % 1000) < 6;
    }

    function starColor(x, y, loopFrac) {
      const twinkle = (hash) => {
        const phase = (hash >>> 24) / 256.0;
        return 0.5 + 0.5 * Math.sin(2 * Math.PI * (2.0 * loopFrac + phase));
      };

      if (isStar(x, y)) {
        const h = hashPixel(x, y, 0);
        const t = twinkle(h);
        if (t < 0.25) return STAR_DIM;
        return STAR_COLORS[(h >>> 12) % STAR_COLORS.length];
      }

      const neighbors = [[1, 0], [-1, 0], [0, 1], [0, -1]];
      for (const [dx, dy] of neighbors) {
        const nx = x + dx;
        const ny = y + dy;
        if (nx >= 0 && nx < width && ny >= 0 && ny < height) {
          if (isStar(nx, ny)) {
            const h = hashPixel(nx, ny, 0);
            const isBright = ((h >>> 8) % 4) === 0;
            if (isBright && twinkle(h) > 0.7) return STAR_GLOW;
          }
        }
      }
      return null;
    }

    function planetColor(x, y) {
      const cx = 212.0, cy = 44.0, radius = 14.0;
      const ox = (x - cx) / radius;
      const oy = (y - cy) / radius;
      const discDist = Math.sqrt(ox * ox + oy * oy);
      const ringDist = Math.sqrt(ox * ox + Math.pow(oy / 0.3, 2));

      const inRing = (ringDist >= 1.35 && ringDist < 1.75);
      const inDisc = (discDist < 1.0);

      if (inRing && (oy > 0 || !inDisc)) {
        return ringDist > 1.55 ? RING_COLORS[1] : RING_COLORS[0];
      }
      if (!inDisc) return null;

      const surfaceZ = Math.sqrt(1.0 - discDist * discDist);
      const lighting = Math.max(0, Math.min(1, -0.6 * ox - 0.5 * oy + 0.62 * surfaceZ));
      const pos = (1.0 - lighting) * 3;
      const idx = Math.floor(pos);
      const stepDown = (pos - idx) > ditherThreshold(x, y);
      return PLANET_RAMP[Math.min(3, idx + (stepDown ? 1 : 0))];
    }

    function render(loopFrac = 0.25) {
      const imgData = ctx.createImageData(width, height);
      const data = imgData.data;

      // 1. Draw space background
      for (let y = 0; y < height; y++) {
        for (let x = 0; x < width; x++) {
          const pIdx = (y * width + x) * 4;
          const col = planetColor(x, y) || starColor(x, y, loopFrac) || nebulaColor(x, y);
          data[pIdx] = col[0];
          data[pIdx + 1] = col[1];
          data[pIdx + 2] = col[2];
          data[pIdx + 3] = 255;
        }
      }
      ctx.putImageData(imgData, 0, 0);

      // 2. Render pixel-art koi silhouette & markings swimming through the cosmic void
      ctx.save();
      ctx.translate(115, 140);
      ctx.rotate(-0.35);

      // Koi body shadow in deep space
      ctx.fillStyle = "rgba(10, 8, 22, 0.7)";
      ctx.beginPath();
      ctx.ellipse(0, 0, 56, 18, 0, 0, Math.PI * 2);
      ctx.fill();

      // Translucent ethereal fins
      ctx.fillStyle = "rgba(235, 240, 255, 0.75)";
      // Pectoral fin left
      ctx.beginPath();
      ctx.ellipse(18, -20, 18, 8, -0.7, 0, Math.PI * 2);
      ctx.fill();
      // Pectoral fin right
      ctx.beginPath();
      ctx.ellipse(18, 20, 18, 8, 0.7, 0, Math.PI * 2);
      ctx.fill();
      // Tail fan (caudal fin)
      ctx.beginPath();
      ctx.moveTo(-45, 0);
      ctx.lineTo(-78, -24);
      ctx.quadraticCurveTo(-65, 0, -82, 0);
      ctx.quadraticCurveTo(-65, 0, -78, 24);
      ctx.closePath();
      ctx.fill();

      // Main torpedo body (Ivory white base)
      ctx.fillStyle = "#f6f5f0";
      ctx.beginPath();
      ctx.ellipse(0, 0, 52, 17, 0, 0, Math.PI * 2);
      ctx.fill();

      // Traditional Japanese Nishikigoi Scarlet Hi Markings
      ctx.fillStyle = "#e63926";
      // Head patch
      ctx.beginPath();
      ctx.ellipse(32, 0, 11, 8, 0, 0, Math.PI * 2);
      ctx.fill();
      // Mid-body saddle
      ctx.beginPath();
      ctx.ellipse(4, -3, 16, 9, 0.2, 0, Math.PI * 2);
      ctx.fill();
      // Tail patch
      ctx.beginPath();
      ctx.ellipse(-24, 2, 9, 6, -0.1, 0, Math.PI * 2);
      ctx.fill();

      // Sumi ink accents
      ctx.fillStyle = "#1e1e24";
      ctx.beginPath();
      ctx.ellipse(-6, 7, 6, 4, 0.4, 0, Math.PI * 2);
      ctx.fill();

      // Dorsal ridge glint
      ctx.strokeStyle = "#ffffff";
      ctx.lineWidth = 1.5;
      ctx.beginPath();
      ctx.moveTo(25, 0);
      ctx.lineTo(-20, 0);
      ctx.stroke();

      // Eyes
      ctx.fillStyle = "#d4af37";
      ctx.fillRect(38, -9, 3, 3);
      ctx.fillRect(38, 7, 3, 3);
      ctx.fillStyle = "#0a0a0a";
      ctx.fillRect(39, -8, 2, 2);
      ctx.fillRect(39, 8, 2, 2);

      ctx.restore();
    }

    render();
  </script>
</body>
</html>
