name: 'Koi Fish GitHub Profile'
description: 'Generates an animated living Koi fish for your GitHub README that matures and evolves with your commits.'
author: 'koi'
inputs:
  username:
    description: 'GitHub username to fetch stats for'
    required: true
    default: ${{ github.repository_owner }}
  output:
    description: 'Path for the generated SVG file'
    required: false
    default: 'koi.svg'
  theme:
    description: 'Koi breed/theme override (kohaku, ogon, sanke, showa, tancho, asagi, neon). Defaults to auto-evolution.'
    required: false
    default: ''
  show-stats:
    description: 'Whether to show the zen statistics badge'
    required: false
    default: 'true'
  show-lilypads:
    description: 'Whether to include floating water lily pads'
    required: false
    default: 'true'
runs:
  using: 'composite'
  steps:
    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: 22

    - name: Run Koi Generator
      shell: bash
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      run: |
        ARGS=("--username" "${{ inputs.username }}" "--output" "${{ inputs.output }}")
        if [ -n "${{ inputs.theme }}" ]; then
          ARGS+=("--theme" "${{ inputs.theme }}")
        fi
        if [ "${{ inputs.show-stats }}" = "false" ]; then
          ARGS+=("--no-stats")
        fi
        if [ "${{ inputs.show-lilypads }}" = "false" ]; then
          ARGS+=("--no-lilypads")
        fi
        node "${{ github.action_path }}/src/index.js" "${ARGS[@]}"
branding:
  icon: 'anchor'
  color: 'orange'
